module_name: CAN
actuator_output:
  show_subgroups_if: 'UAVCAN_ENABLE=0'
  config_parameters:
    - param: 'CAN_BITRATE'
      label: 'Bitrate'
  output_groups:
    - param_prefix: CAN_EC
      group_label: 'ESCs'
      channel_label: 'ESC'
      standard_params:
        disarmed: { min: 0, max: 10000, default: 5000 }
        min: { min: 0, max: 20000, default: 10000 }
        max: { min: 0, max: 20000, default: 20000 }
        failsafe: { min: 10000, max: 20000 }
      num_channels: 8
    - param_prefix: CAN_SV
      group_label: 'Servos'
      channel_label: 'Servo'
      standard_params:
        disarmed: { min: 0, max: 1000, default: 500 }
        min: { min: 0, max: 1000, default: 0 }
        max: { min: 0, max: 1000, default: 1000 }
        failsafe: { min: 0, max: 1000 }
      num_channels: 8
